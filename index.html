<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Music Premium</title>
    <style>
        :root {
            --bg-main: #030303;
            --bg-sidebar: #0f0f0f;
            --bg-card: #1f1f1f;
            --text-main: #ffffff;
            --text-dim: #aaaaaa;
            --accent: #ff0033;
            --control-bg: #212121;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* LAYOUT ARCHITECTURE */
        .sidebar {
            width: 240px;
            background-color: var(--bg-sidebar);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            border-right: 1px solid #222;
        }

        .brand {
            font-size: 22px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-main);
        }

        .brand span {
            color: var(--accent);
        }

        .nav-menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-item {
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            color: var(--text-dim);
            transition: all 0.2s;
        }

        .nav-item:hover, .nav-item.active {
            background-color: #222;
            color: var(--text-main);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 30px;
            overflow-y: auto;
            padding-bottom: 120px; /* Space for control deck */
        }

        /* HEADER & SEARCH ENGINE */
        .search-container {
            display: flex;
            max-width: 600px;
            width: 100%;
            gap: 12px;
            margin-bottom: 30px;
        }

        .search-bar {
            flex: 1;
            background-color: #121212;
            border: 1px solid #282828;
            padding: 14px 20px;
            border-radius: 30px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: border 0.2s;
        }

        .search-bar:focus {
            border-color: var(--accent);
        }

        .btn-action {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 0 24px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            font-size: 15px;
        }

        /* STYLED CONTENT BLOCKS */
        .section-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }

        .music-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }

        .music-card {
            background-color: var(--bg-sidebar);
            padding: 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            border: 1px solid #181818;
        }

        .music-card:hover {
            background-color: #181818;
            transform: translateY(-4px);
        }

        /* DYNAMIC ARTWORK FRAME FOR IOS ENGINE AGREEABILITY */
        .card-art-frame {
            width: 100%;
            aspect-ratio: 1;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 14px;
            position: relative;
        }

        #yt-api-player {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .card-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-artist {
            font-size: 13px;
            color: var(--text-dim);
        }

        /* PERSISTENT BOTTOM CONTROL DECK */
        .control-deck {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 90px;
            background-color: var(--control-bg);
            border-top: 1px solid #282828;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            z-index: 100;
        }

        .deck-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            width: 30%;
        }

        .deck-details {
            overflow: hidden;
        }

        .deck-title {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .deck-status {
            font-size: 12px;
            color: var(--accent);
            font-weight: bold;
            text-transform: uppercase;
            margin-top: 2px;
        }

        .deck-center-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 40%;
        }

        .deck-buttons {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .circle-btn {
            background-color: white;
            color: black;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .circle-btn.secondary {
            background-color: transparent;
            color: var(--text-main);
            font-size: 22px;
        }

        /* RESPONSIVE LAYOUT CONSTRAINTS FOR PHONES */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                height: auto;
                padding: 16px;
                border-right: none;
                border-bottom: 1px solid #222;
            }
            .nav-menu {
                flex-direction: row;
                justify-content: space-around;
            }
            .main-content {
                padding: 20px;
            }
            .control-deck {
                padding: 0 16px;
            }
            .deck-meta {
                width: 45%;
            }
            .deck-center-controls {
                width: 50%;
            }
        }
    </style>
</head>
<body>

    <!-- LEFT NAVIGATION SIDEBAR -->
    <div class="sidebar">
        <div class="brand">🎵 YouTube <span>Music</span></div>
        <ul class="nav-menu">
            <li class="nav-item active">Home</li>
            <li class="nav-item">Explore</li>
            <li class="nav-item">Library</li>
            <li class="nav-item" style="color: gold;">★ Premium Active</li>
        </ul>
    </div>

    <!-- MAIN INTERACTIVE PORTAL -->
    <div class="main-content">
        <div class="search-container">
            <input type="text" id="track-url-input" class="search-bar" placeholder="Paste YouTube link or Track ID here...">
            <button class="btn-action" onclick="loadPremiumTrack()">Stream</button>
        </div>

        <div class="section-title">Now Playing Sandbox</div>
        <div class="music-grid">
            <div class="music-card">
                <!-- Video framework strictly housed inside the interactive card mesh -->
                <div class="card-art-frame">
                    <div id="yt-api-player"></div>
                </div>
                <div class="card-title" id="display-title">No Engine Initialized</div>
                <div class="card-artist" id="display-artist">Input link above to start</div>
            </div>
        </div>

        <div class="section-title">Quick Mix Recommendations</div>
        <div class="music-grid" id="quick-mix-container">
            <!-- Programmatically injected playlist decks populate here -->
        </div>
    </div>

    <!-- PERSISTENT BOTTOM CONTROL DECK -->
    <div class="control-deck">
        <div class="deck-meta">
            <div class="deck-details">
                <div class="deck-title" id="deck-track-title">Standby Mode</div>
                <div class="deck-status" id="deck-track-status">Offline</div>
            </div>
        </div>

        <div class="deck-center-controls">
            <div class="deck-buttons">
                <button class="circle-btn secondary" onclick="skipTrack(-1)">⏮</button>
                <button class="circle-btn" id="master-play-pause-btn" onclick="togglePlaybackState()">▶</button>
                <button class="circle-btn secondary" onclick="skipTrack(1)">⏭</button>
            </div>
        </div>
        
        <div style="width: 20%; display: flex; justify-content: flex-end; color: var(--text-dim); font-size: 13px;">
            HQ Audio 256kbps
        </div>
    </div>

    <script>
        // Mount YouTube Iframe Engine Layer
        var tag = document.createElement('script');
        
tag.src = "youtube.com";
var firstScriptTag = document.getElementsByTagName('script');
firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
var player;
var playbackQueue = [
{ id: 'dQw4w9WgXcQ', title: 'Rick Astley - Never Gonna Give You Up', artist: 'Classic Mix' },
{ id: 'kJQP7kiw5Fk', title: 'Luis Fonsi - Despacito ft. Daddy Yankee', artist: 'Pop Hits' },
{ id: '9bZkp7q19f0', title: 'PSY - GANGNAM STYLE', artist: 'K-Pop Mix' }
];
var currentQueueIndex = 0;
function onYouTubeIframeAPIReady() {
player = new YT.Player('yt-api-player', {
videoId: playbackQueue[currentQueueIndex].id,
playerVars: {
'playsinline': 1,    // Sandbox strict compliance for running inside Safari mobile viewport frames
'controls': 0,       // Removes visual system sliders to maintain premium layout
'modestbranding': 1,
'rel': 0
},
events: {
'onReady': onPlayerEngineReady,
'onStateChange': onPlayerStateEngineChange
}
});
}
function onPlayerEngineReady() {
updateDashboardDisplay(playbackQueue[currentQueueIndex].title, "Ready to Play");
renderQuickMixPlaylist();
}
function extractVideoId(url) {
var regExp = /^.(youtu.be/|v/|u/\w/|embed/|watch?v=|&v=)([^#&?]).*/;
var match = url.trim().match(regExp);
return (match && match.length == 11) ? match : url.trim();
}
function loadPremiumTrack() {
var inputData = document.getElementById('track-url-input').value;
var id = extractVideoId(inputData);
if (id && id.length === 11) {
var newTrack = { id: id, title: "Custom Stream: " + id, artist: "Web Import" };
playbackQueue.push(newTrack);
currentQueueIndex = playbackQueue.length - 1;
player.loadVideoById(id);
document.getElementById('track-url-input').value = "";
} else {
alert("Please enter a valid 11-digit YouTube ID string or complete address.");
}
}
function togglePlaybackState() {
if (!player || !player.getPlayerState) return;
var state = player.getPlayerState();
if (state === YT.PlayerState.PLAYING) {
player.pauseVideo();
} else {
player.playVideo();
}
}
function skipTrack(direction) {
currentQueueIndex += direction;
if (currentQueueIndex >= playbackQueue.length) currentQueueIndex = 0;
if (currentQueueIndex < 0) currentQueueIndex = playbackQueue.length - 1;
player.loadVideoById(playbackQueue[currentQueueIndex].id);
}
function playSpecificTrack(id, title, artist) {
for(var i=0; i<playbackQueue.length; i++) {
if(playbackQueue[i].id === id) {
currentQueueIndex = i;
player.loadVideoById(id);
return;
}
}
playbackQueue.push({id: id, title: title, artist: artist});
currentQueueIndex = playbackQueue.length - 1;
player.loadVideoById(id);
}
function onPlayerStateEngineChange(event) {
var statusStr = "";
var playButton = document.getElementById('master-play-pause-btn');
var currentTrack = playbackQueue[currentQueueIndex];
switch(event.data) {
case YT.PlayerState.PLAYING:
statusStr = "Now Playing";
playButton.innerText = "❚❚";
break;
case YT.PlayerState.PAUSED:
statusStr = "Paused";
playButton.innerText = "▶";
break;
case YT.PlayerState.BUFFERING:
statusStr = "Buffering";
break;
case YT.PlayerState.ENDED:
skipTrack(1); // Auto-advance queue logic
break;
default:
statusStr = "Ready";
playButton.innerText = "▶";
}
updateDashboardDisplay(currentTrack.title, statusStr, currentTrack.artist);
}
function updateDashboardDisplay(title, status, artist = "YouTube Premium Engine") {
document.getElementById('display-title').innerText = title;
document.getElementById('display-artist').innerText = artist;
document.getElementById('deck-track-title').innerText = title;
document.getElementById('deck-track-status').innerText = status;
}
function renderQuickMixPlaylist() {
var container = document.getElementById('quick-mix-container');
container.innerHTML = "";
playbackQueue.forEach(function(track) {
var card = document.createElement('div');
card.className = "music-card";
card.onclick = function() { playSpecificTrack(track.id, track.title, track.artist); };
card.innerHTML = <div class="card-art-frame" style="background: linear-gradient(135deg, #111, #333); display:flex; align-items:center; justify-content:center; font-size:24px;">🎵</div> <div class="card-title">${track.title}</div> <div class="card-artist">${track.artist}</div>;
container.appendChild(card);
});
}
