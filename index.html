<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Player</title>
    <style>
        :root {
            --bg-color: #030303;
            --card-bg: #1f1f1f;
            --accent-color: #ff0000;
            --text-color: #ffffff;
            --text-dim: #aaa;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .player-container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .search-box {
            display: flex;
            margin-bottom: 25px;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #0f0f0f;
            color: white;
            font-size: 14px;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .track-info {
            margin: 20px 0;
        }

        .track-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .track-status {
            color: var(--text-dim);
            font-size: 14px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .control-btn {
            background-color: #333;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        /* Completely hides the visual video iframe container to replicate an audio-only player */
        #hidden-player-container {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <div class="search-box">
            <input type="text" id="video-input" placeholder="Paste YouTube Link or Video ID...">
            <button onclick="loadTrack()">Load</button>
        </div>

        <div class="track-info">
            <div class="track-title" id="player-title">No Track Loaded</div>
            <div class="track-status" id="player-status">Stopped</div>
        </div>

        <div class="controls">
            <button class="control-btn" onclick="playMusic()">▶</button>
            <button class="control-btn" onclick="pauseMusic()">❚❚</button>
        </div>
    </div>

    <!-- The actual YouTube API mounts inside this hidden div -->
    <div id="hidden-player-container">
        <div id="yt-api-player"></div>
    </div>

    <script>
        // Load the official YouTube Iframe Player API asynchronously
        var tag = document.createElement('script');
        tag.src = "https://youtube.com";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-api-player', {
                height: '0',
                width: '0',
                videoId: '', 
                playerVars: {
                    'playsinline': 1, // Crucial for iOS background/inline execution
                    'controls': 0,
                    'disablekb': 1,
                    'fs': 0
                },
                events: {
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function extractVideoId(url) {
            var regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            var match = url.match(regExp);
            return (match && match[2].length == 11) ? match[2] : url;
        }

        function loadTrack() {
            var input = document.getElementById('video-input').value;
            var videoId = extractVideoId(input);
            
            if (videoId) {
                player.loadVideoById(videoId);
                document.getElementById('player-title').innerText = "Video ID: " + videoId;
            } else {
                alert("Please enter a valid YouTube Video ID or URL");
            }
        }

        function playMusic() {
            if (player) {
                player.playVideo();
            }
        }

        function pauseMusic() {
            if (player) {
                player.pauseVideo();
            }
        }

        function onPlayerStateChange(event) {
            var statusText = "";
            switch(event.data) {
                case YT.PlayerState.PLAYING:
                    statusText = "Playing";
                    // Attempt to grab video title if available across origin limits
                    if(player.getVideoData && player.getVideoData().title) {
                        document.getElementById('player-title').innerText = player.getVideoData().title;
                    }
                    break;
                case YT.PlayerState.PAUSED:
                    statusText = "Paused";
                    break;
                case YT.PlayerState.ENDED:
                    statusText = "Finished";
                    break;
                case YT.PlayerState.BUFFERING:
                    statusText = "Buffering...";
                    break;
                default:
                    statusText = "Stopped";
            }
            document.getElementById('player-status').innerText = statusText;
        }
    </script>
</body>
</html>
